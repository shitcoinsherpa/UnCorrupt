[project]
name = "uncorrupt"
version = "1.0.0"
description = "Detection and prevention of scientific identifier corruption in spreadsheets"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-calamine>=0.6",  # fast loader for big xlsx (v0.6)
    "frictionless>=5.0",
    "python-dateutil>=2.9",
    "confusable-homoglyphs>=3.3",
]

[project.optional-dependencies]
ui = ["gradio>=5.0"]
llm = ["transformers", "torch", "accelerate"]
calibration = ["scikit-learn>=1.3", "matplotlib>=3.7"]
mutation = ["cosmic-ray>=8.4"]

[project.scripts]
uncorrupt = "uncorrupt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncorrupt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.mutmut]
# Scope mutation testing to the detection hot-path. Utility/IO modules
# (app.py loader plumbing, schema_export, corrections) are out of scope
# for the initial pass; extend after detector kill rate is >= 90%.
paths_to_mutate = ["src/uncorrupt/detector.py"]
mutate_only_covered_lines = false
# Skip tests that load big corpus data files (they don't exercise
# detector.py mutants and the data isn't copied into the mutants/ tree).
pytest_add_cli_args = [
    "--forked",  # subprocess-isolate each test (works around numpy "cannot load twice")
    "--ignore=tests/test_app_integration.py",
    "--ignore=tests/test_app_local_llm.py",
    "--ignore=tests/test_corpus.py",
    "--ignore=tests/test_precision.py",
    "--ignore=tests/test_koh_replication.py",
    "--ignore=tests/test_misnamed_files.py",
    "--ignore=tests/test_xref_lookup.py",
    "--ignore=tests/test_benchmark.py",
]
also_copy = ["src/", "tests/", "data/raw/registries/"]
