[project]
name = "uncorrupt"
version = "1.0.1"
description = "Detection and prevention of scientific identifier corruption in spreadsheets"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-calamine>=0.6",  # fast loader for big xlsx
    "frictionless>=5.0",
    "python-dateutil>=2.9",
    "confusable-homoglyphs>=3.3",
    "gradio>=5.0",            # the desktop UI ships by default
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1",
]

[project.scripts]
uncorrupt = "uncorrupt.cli:main"
uncorrupt-app = "uncorrupt.app:_launch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncorrupt"]
# Ship registry data inside the package so pip installs work standalone.
[tool.hatch.build.targets.wheel.shared-data]
"src/uncorrupt/_data" = "uncorrupt/_data"

[tool.hatch.build.targets.wheel.force-include]
"src/uncorrupt/_data" = "uncorrupt/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
