[project]
name = "uncorrupt"
version = "1.0.2"
description = "Detection and prevention of scientific identifier corruption in spreadsheets"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "LLMSherpa"},
]
keywords = [
    "bioinformatics",
    "genomics",
    "gene-symbols",
    "excel-corruption",
    "spreadsheet-validation",
    "HGNC",
    "RIKEN",
    "data-cleaning",
    "reproducibility",
    "FAIR",
]
# PyPI classifiers. shields.io reads the Python ones to populate
# the pyversions badge; the others surface UnCorrupt in PyPI's
# faceted search (Topic / Intended Audience / Development Status).
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-calamine>=0.6",  # fast loader for big xlsx
    "frictionless>=5.0",
    "python-dateutil>=2.9",
    "confusable-homoglyphs>=3.3",
    "gradio>=5.0",            # the desktop UI ships by default
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1",
    # Type stubs for third-party libraries we use, so mypy doesn't
    # error with "Library stubs not installed" on every import.
    "pandas-stubs>=2.0",
    "types-openpyxl>=3.1",
    "types-python-dateutil>=2.9",
]

[project.scripts]
uncorrupt = "uncorrupt.cli:main"
uncorrupt-app = "uncorrupt.app:_launch"

# Project URLs surface on the PyPI sidebar. shields.io and discovery
# tools also use them. Keep these in sync with the README and the
# satellite repo links.
[project.urls]
Homepage = "https://github.com/shitcoinsherpa/UnCorrupt"
Source = "https://github.com/shitcoinsherpa/UnCorrupt"
Documentation = "https://github.com/shitcoinsherpa/UnCorrupt/blob/main/docs/methods.md"
Changelog = "https://github.com/shitcoinsherpa/UnCorrupt/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/shitcoinsherpa/UnCorrupt/issues"
"Browser app" = "https://huggingface.co/spaces/Sherpa/uncorrupt"
"Browser-only WASM" = "https://shitcoinsherpa.github.io/uncorrupt-pyodide/"
"Release notes" = "https://github.com/shitcoinsherpa/UnCorrupt/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` includes every file under the listed directories (Python
# AND data files), so the bundled `_data/registries/` ships inside the
# wheel automatically. Earlier revisions added force-include / shared-data
# on top of this and produced duplicate ZIP entries that PyPI's upload
# rejects ("400 Invalid distribution file. ZIP archive not accepted:
# Duplicate filename in local headers"). Leave this as the single source.
packages = ["src/uncorrupt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Style-only rules we intentionally allow:
#   E501  Long lines (occasionally needed for readable regex / tables).
#   E402  Module-level imports not at top: detector.py defers heavy imports
#         (numpy, openpyxl) until needed so `python -c "from uncorrupt ..."`
#         stays fast.
#   E701  Single-line `if cond: continue` is acceptable for short guards.
#   B007  Unused loop variable: occurs in our band-bucketing loop where the
#         threshold value is the loop key, deliberately unused in the body.
ignore = ["E501", "E402", "E701", "B007"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# Stubs we ship via the dev extra cover pandas, openpyxl, dateutil;
# everything else (gradio, frictionless, python-calamine, etc.) is
# allowed to be untyped without erroring.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# Keep these on (catch real bugs without demanding full annotation
# coverage on a research-grown codebase):
warn_return_any = false
warn_unreachable = true
check_untyped_defs = true
# Don't demand annotations on every function. The detector evolved as
# a single dense module and annotating every internal helper is busy-
# work; new code should still be typed, and `mypy --strict src` can
# be run locally when a tightening pass is warranted.
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
# pandas-stubs reports the index of iterrows()/Series.items() as
# `Hashable` rather than `int`, so every `int(idx)` we use to coerce
# back to a plain int triggers [call-overload]. This is type-checker
# noise (the value IS always an int at runtime in our usage); silencing
# the rule is cheaper and clearer than scattering `# type: ignore`
# annotations across every loop in the detector.
disable_error_code = ["call-overload"]
