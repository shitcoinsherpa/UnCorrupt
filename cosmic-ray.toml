# Cosmic-ray configuration for mutation testing the UnCorrupt detector.
#
# Cosmic-ray runs each mutant in a subprocess (unlike mutmut, which keeps
# everything in one Python process). The subprocess boundary sidesteps
# the numpy "cannot load twice" error that blocks mutmut.
#
# Run:
#   cosmic-ray init cosmic-ray.toml uncorrupt-detector.sqlite
#   cosmic-ray --verbosity=INFO baseline cosmic-ray.toml
#   cosmic-ray exec cosmic-ray.toml uncorrupt-detector.sqlite
#   cr-report uncorrupt-detector.sqlite

[cosmic-ray]
module-path = "src/uncorrupt/detector.py"
timeout = 600.0  # full test suite takes ~120s; allow 5x for slow mutants
# Skip large-context tests that won't exercise detector hot-path mutants.
excluded-modules = []
test-command = ".venv/bin/pytest -x --tb=no -q tests/test_detector_v5.py tests/test_simulator.py tests/test_boundaries.py tests/test_detector.py tests/test_boundary_properties.py"

[cosmic-ray.distributor]
name = "local"
