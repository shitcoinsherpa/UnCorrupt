name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# Explicit read-only token scope. Required by recent checkout versions
# and is the right default regardless. actions/checkout@v6 was tried
# briefly (Dependabot bumped to it) but had an unresolved 403 regression
# even with permissions: contents:read set; reverted to v5 which is
# stable.
permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests

      - name: Type check
        run: |
          mypy src

      - name: Unit + integration tests
        run: |
          pytest -q \
            --ignore=tests/test_app_local_llm.py \
            --ignore=tests/test_app_integration.py

      - name: Detector smoke pass on tiny fixture
        run: |
          python -c "
          from datetime import date
          import pandas as pd
          from uncorrupt.detector import detect
          df = pd.DataFrame({'gene_symbol': ['BRCA1', date(2024, 9, 2), 'TP53']})
          df.attrs['cell_formats'] = {('gene_symbol', 1): 'd-mmm'}
          r = detect(df)
          s = next(x for x in r.suspicions if x.value.month == 9)
          assert 'SEPT2' in s.suggestion, f'expected SEPT2, got {s.suggestion!r}'
          print('smoke OK:', s.suggestion)
          "

      - name: CLI smoke pass
        run: |
          uncorrupt --help
          uncorrupt detect --help
          uncorrupt schema --help
          uncorrupt audit --help

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t uncorrupt:ci .

      - name: Smoke import in container
        run: |
          docker run --rm uncorrupt:ci python -c \
            "from uncorrupt.detector import detect_file; from uncorrupt.app import build_app; print('container OK')"
