name: release

# Trigger on a version tag (e.g., v1.0.0). Publishes to:
#   - PyPI (via Trusted Publishing (no API token required))
#   - GitHub Container Registry (ghcr.io/shitcoinsherpa/uncorrupt:<tag>)
#   - GitHub Release (with attached wheel + sdist + SBOM)
#   - Zenodo (auto-DOI on release via GitHub-Zenodo integration; see
#     `.zenodo.json` for the metadata that Zenodo reads at release time).
#
# Prerequisites:
#   1. Project registered on PyPI with this repo as a Trusted Publisher.
#      (https://docs.pypi.org/trusted-publishers/)
#   2. Zenodo connected to this GitHub repo (one-click at zenodo.org).
#   3. GITHUB_TOKEN has packages:write (default for the release job).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # for GitHub Release
  id-token: write   # for PyPI Trusted Publishing OIDC
  packages: write   # for ghcr.io

jobs:
  build-wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Check distributions
        run: twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uncorrupt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    name: Publish container to ghcr.io
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Pillar 2 forbids ":latest" tags in published images: ship the
          # version tag only so consumers must pin explicitly.
          tags: |
            ghcr.io/${{ github.repository_owner }}/uncorrupt:${{ needs.build-wheel.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.build-wheel.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  github-release:
    name: Attach distributions to GitHub Release
    needs: [build-wheel, publish-pypi, publish-ghcr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment --output-file sbom.json --output-format JSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            sbom.json
          generate_release_notes: true
          body: |
            UnCorrupt ${{ needs.build-wheel.outputs.version }}

            ## What this release ships

            - `pip install uncorrupt==${{ needs.build-wheel.outputs.version }}`
            - `docker pull ghcr.io/${{ github.repository_owner }}/uncorrupt:${{ needs.build-wheel.outputs.version }}`
            - CycloneDX SBOM attached
            - Zenodo DOI minted automatically (see `.zenodo.json`)

            ## Quick start

            ```
            uncorrupt detect path/to/spreadsheet.xlsx
            uncorrupt schema path/to/spreadsheet.xlsx
            uncorrupt audit  path/to/folder/
            ```

            See `README.md` and `CHANGELOG.md` for full details.
